<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLU Reference Hub</title>
    <style>
        /* ... (style sebelumnya sama) ... */
        
        /* Tambahan untuk UX yang lebih baik */
        .sub-pills-primary {
            display: flex;
            gap: 8px;
            margin-bottom: 12px;
            overflow-x: auto;
            padding-bottom: 12px;
            border-bottom: 2px solid rgba(255,255,255,0.3);
            flex-wrap: wrap;
        }
        .sub-pills-secondary {
            display: flex;
            gap: 8px;
            margin-bottom: 14px;
            overflow-x: auto;
            padding-bottom: 4px;
            flex-wrap: wrap;
            animation: slideDown 0.3s ease-out;
        }
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        .breadcrumb {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-bottom: 12px;
            padding: 6px 12px;
            background: var(--glass-bg);
            border-radius: 12px;
            border: 1px solid var(--glass-border);
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .breadcrumb span { opacity: 0.6; }
        .breadcrumb .active-bread { opacity: 1; font-weight: 700; color: var(--text-main); }
        .sub-pill.has-children::after {
            content: " ▼";
            font-size: 0.6rem;
            opacity: 0.5;
        }
        .sub-pill.has-children.active::after {
            content: " ▲";
        }
    </style>
</head>
<body>
    <!-- ... (HTML sama) ... -->
    <div id="detail-view">
        <div class="detail-header">
            <button class="back-btn" onclick="goBack()">← Kembali</button>
            <div class="legend-bar">
                <div class="legend-item"><span class="box bg-raw"></span> RAW</div>
                <div class="legend-item"><span class="box bg-konv"></span> KONV</div>
            </div>
        </div>
        <div class="brand-title" id="brandTitle"></div>
        
        <!-- Breadcrumb Navigation -->
        <div class="breadcrumb" id="breadcrumb"></div>
        
        <!-- Primary Sub Pills (Level 1) -->
        <div class="sub-pills-primary" id="subPillsContainer"></div>
        
        <!-- Secondary Sub Pills (Level 2 - Kategori) -->
        <div id="kategoriContainer"></div>
        
        <div class="grid-container" id="productGrid"></div>
    </div>

    <script>
        // ... (script sebelumnya sama, dengan perubahan di render function) ...

        function renderSubPills() {
            const container = document.getElementById('subPillsContainer');
            container.innerHTML = '';
            
            const subs = SUB_CONFIG[currentBrand] || [];
            const hasChildren = ['yummychoice', 'yummycoffee'].includes(currentBrand);
            
            subs.forEach(s => {
                const el = document.createElement('div');
                el.className = `sub-pill ${s.id === currentSub ? 'active' : ''}`;
                if (hasChildren && (s.id === 'bkl' || s.id === 'dcf')) {
                    el.classList.add('has-children');
                }
                el.innerText = s.label;
                el.onclick = () => filterSub(s.id);
                container.appendChild(el);
            });

            renderKategoriPills();
            renderBreadcrumb();
        }

        function renderKategoriPills() {
            const container = document.getElementById('kategoriContainer');
            container.innerHTML = '';

            if (!currentSub) return;

            let categories = [];
            let labelMap = {};

            if (currentBrand === 'yummychoice' && currentSub === 'bkl') {
                categories = ['snack_rte', 'dimsum', 'pao', 'fried_chicken', 'frozen_fc', 'sosis', 'pizza'];
                labelMap = KATEGORI_LABEL;
            } else if (currentBrand === 'yummycoffee' && currentSub === 'bkl') {
                categories = ['jelly', 'syrup', 'powder'];
                labelMap = KATEGORI_LABEL_COFFEE;
            } else {
                return;
            }

            if (categories.length === 0) return;

            // Create wrapper with animation
            const wrapper = document.createElement('div');
            wrapper.className = 'sub-pills-secondary';
            
            const allEl = document.createElement('div');
            allEl.className = `sub-pill kategori-pill ${currentKategori === 'all' ? 'active' : ''}`;
            allEl.innerText = '📋 Semua';
            allEl.onclick = () => filterKategori('all');
            wrapper.appendChild(allEl);

            categories.forEach(kat => {
                const el = document.createElement('div');
                el.className = `sub-pill kategori-pill ${kat === currentKategori ? 'active' : ''}`;
                el.innerText = labelMap[kat] || kat;
                el.onclick = () => filterKategori(kat);
                wrapper.appendChild(el);
            });
            
            container.appendChild(wrapper);
        }

        function renderBreadcrumb() {
            const container = document.getElementById('breadcrumb');
            const brandNames = {
                'saybread': '🍞 Say Bread',
                'sayburger': '🍔 Say Burger',
                'yummychoice': '🍱 Yummy Choice',
                'yummycoffee': '☕ Yummy Coffee Gold'
            };
            
            let html = `<span>🏠</span> <span>›</span> <span>${brandNames[currentBrand] || ''}</span>`;
            
            if (currentSub) {
                const subConfig = SUB_CONFIG[currentBrand] || [];
                const found = subConfig.find(s => s.id === currentSub);
                if (found) {
                    html += ` <span>›</span> <span class="active-bread">${found.label}</span>`;
                }
            }
            
            if (currentKategori !== 'all') {
                const labelMap = currentBrand === 'yummychoice' ? KATEGORI_LABEL : KATEGORI_LABEL_COFFEE;
                const label = labelMap[currentKategori] || currentKategori;
                html += ` <span>›</span> <span class="active-bread">${label}</span>`;
            }
            
            container.innerHTML = html;
        }

        // ... (fungsi lainnya sama) ...
    </script>
</body>
</html>
