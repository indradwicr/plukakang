<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#0073ea">
    <title>plukakang - hapalkeun euy!</title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@700&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-app: #f6f8fc;
            --text-main: #111827;
            --text-muted: #4b5563;
            --text-light: #9ca3af;
            --primary-blue: #0073ea;
            --card-white: #ffffff;
            --card-shadow: 0 4px 16px rgba(17, 24, 39, 0.05);
            --card-border: #e5e7eb;
            --raw-bg: #eff6ff;
            --raw-border: #bfdbfe;
            --raw-text: #1d4ed8;
            --konv-bg: #fefce8;
            --konv-border: #fef08a;
            --konv-text: #a16207;
            --font-main: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            --font-code: 'JetBrains Mono', monospace;
            --dark-green: #1b4d2e;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: var(--font-main);
            background-color: var(--bg-app);
            color: var(--text-main);
            margin: 0; padding: 0;
            min-height: 100vh;
            display: flex; justify-content: center;
            -webkit-font-smoothing: antialiased;
        }

        .app-layout {
            width: 100%;
            max-width: 480px;
            min-height: 100vh;
            background: var(--bg-app);
            padding: 16px 16px 88px 16px;
            position: relative;
        }

        /* ===== HEADER ===== */
        .app-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .brand-block { display: flex; align-items: center; gap: 12px; }
        .brand-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #0073ea, #4f46e5);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            color: #ffffff; font-size: 1.25rem;
            box-shadow: 0 4px 14px rgba(0, 115, 234, 0.28);
        }
        .brand-title-group h1 { font-size: 1.25rem; font-weight: 800; letter-spacing: -0.4px; line-height: 1.1; }
        .brand-title-group span { font-size: 0.74rem; color: #0073ea; font-weight: 700; }
        .icon-action-btn {
            width: 40px; height: 40px; border-radius: 50%;
            background: var(--card-white); border: 1px solid var(--card-border);
            display: flex; align-items: center; justify-content: center;
            color: var(--text-main); font-size: 0.95rem; cursor: pointer;
            box-shadow: var(--card-shadow); transition: transform 0.15s ease;
        }
        .icon-action-btn:active { transform: scale(0.92); }

        /* ===== GREETING ===== */
        #greetingWrapper.hidden { display: none; }
        .greeting-container {
            background: linear-gradient(145deg, #ffffff, #f0f4ff);
            border-radius: 24px; padding: 20px 22px;
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 30px rgba(0, 115, 234, 0.08);
            margin-bottom: 16px; position: relative; overflow: hidden;
        }
        .greeting-container::before {
            content: ''; position: absolute; top: -40%; right: -20%;
            width: 200px; height: 200px;
            background: radial-gradient(circle, rgba(0,115,234,0.06) 0%, transparent 70%);
            border-radius: 50%; pointer-events: none;
        }
        .greeting-date-time {
            display: flex; justify-content: space-between; align-items: center;
            font-size: 0.82rem; font-weight: 700; color: var(--text-muted);
            position: relative; z-index: 1; flex-wrap: wrap; gap: 6px;
        }
        .greeting-date-time .date-display {
            color: var(--text-main); font-weight: 600;
            background: rgba(0, 0, 0, 0.04);
            padding: 4px 14px; border-radius: 20px; font-size: 0.78rem;
        }
        .greeting-date-time .time-display {
            font-family: var(--font-code); color: var(--primary-blue); font-size: 0.9rem;
            background: rgba(0, 115, 234, 0.07);
            padding: 4px 14px; border-radius: 20px; font-weight: 700;
        }
        .greeting-divider {
            height: 2px;
            background: linear-gradient(to right, rgba(0,115,234,0.08), rgba(0,115,234,0.25), rgba(0,115,234,0.08));
            margin: 12px 0 10px 0; border-radius: 2px;
        }
        .greeting-sapaan {
            font-size: 1.1rem; font-weight: 800; color: var(--text-main);
            min-height: 32px; display: flex; align-items: center; gap: 10px;
        }
        .greeting-sapaan .greeting-icon { font-size: 1.4rem; }

        /* ===== SEARCH ===== */
        .sticky-search-bar {
            position: sticky; top: 0; z-index: 50;
            padding: 6px 0 14px 0;
            background: linear-gradient(to bottom,
                rgba(246, 248, 252, 0.98) 0%,
                rgba(246, 248, 252, 0.92) 60%,
                rgba(246, 248, 252, 0) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
        }
        .search-field { position: relative; display: flex; align-items: center; }
        .search-input {
            width: 100%; padding: 13px 40px 13px 16px;
            background: var(--card-white); border: 1.5px solid var(--card-border);
            border-radius: 18px; font-size: 0.88rem; font-family: inherit;
            font-weight: 600; outline: none; color: var(--text-main);
            box-shadow: var(--card-shadow);
        }
        .search-input:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 4px 18px rgba(0, 115, 234, 0.18);
        }
        .search-clear-btn {
            position: absolute; right: 12px;
            background: rgba(17, 24, 39, 0.08); border: none;
            width: 24px; height: 24px; border-radius: 50%;
            font-size: 0.72rem; color: var(--text-muted);
            cursor: pointer; display: none;
            align-items: center; justify-content: center;
        }

        /* ===== SECTION ===== */
        .section-bar {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
        }
        .section-title { font-size: 1.05rem; font-weight: 800; letter-spacing: -0.3px; }
        .item-count-chip {
            font-size: 0.72rem; font-weight: 800; color: var(--text-muted);
            background: #e2e8f0; padding: 4px 10px; border-radius: 12px;
        }

        /* ===== BRAND GRID ===== */
        .brand-grid {
            display: grid; grid-template-columns: repeat(2, 1fr);
            gap: 12px; margin-bottom: 24px;
        }
        .brand-card {
            background: var(--card-white); border-radius: 22px;
            padding: 16px; border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
            display: flex; flex-direction: column; justify-content: space-between;
            height: 130px; cursor: pointer;
            transition: transform 0.2s ease;
        }
        .brand-card:active { transform: scale(0.96); }
        .brand-card-top { display: flex; justify-content: space-between; align-items: flex-start; gap: 10px; }
        .brand-card-icon {
            width: 44px; height: 44px; border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-size: 1.3rem; flex-shrink: 0;
        }
        .card-saybread { background: #fdf6f0; }
        .card-saybread .brand-card-icon { background: #8c5332; color: #fff; }
        .card-sayburger { background: #fff1f2; }
        .card-sayburger .brand-card-icon { background: #e11d48; color: #fff; }
        .card-yummychoice { background: #ffedd5; }
        .card-yummychoice .brand-card-icon { background: #f97316; color: #fff; }
        .card-yummycoffee { background: #fffbeb; }
        .card-yummycoffee .brand-card-icon { background: #d97706; color: #fff; }
        .card-pointcoffee { background: #dcfce7; }
        .card-pointcoffee .brand-card-icon { background: #15803d; color: #fff; }
        .card-hambalanfc { background: #dbeafe; }
        .card-hambalanfc .brand-card-icon { background: #1e40af; color: #fff; }
        .card-perishable { background: #ecfdf5; }
        .card-perishable .brand-card-icon { background: #059669; color: #fff; }
        .brand-card-bottom { flex: 1; display: flex; flex-direction: column; justify-content: flex-end; }
        .brand-card-bottom h3 { font-size: 0.98rem; font-weight: 800; line-height: 1.2; }
        .brand-card-bottom p { font-size: 0.7rem; color: var(--text-muted); font-weight: 600; margin-top: 2px; }

        /* ===== PILLS ===== */
        .pills-container {
            display: flex; gap: 8px; overflow-x: auto;
            scrollbar-width: none; margin-bottom: 12px; padding-bottom: 4px;
        }
        .pills-container::-webkit-scrollbar { display: none; }
        .pill-button {
            background: var(--card-white); border: 1px solid var(--card-border);
            padding: 7px 14px; border-radius: 18px;
            font-size: 0.76rem; font-family: inherit; font-weight: 700;
            color: var(--text-muted); cursor: pointer; white-space: nowrap;
            transition: all 0.2s ease; user-select: none;
        }
        .pill-button:active { transform: scale(0.95); }
        .pill-button.active {
            background: var(--primary-blue); color: #ffffff;
            border-color: var(--primary-blue);
        }

        /* ===== DETAIL VIEW ===== */
        .detail-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 12px; flex-wrap: wrap; gap: 8px;
        }
        .back-btn {
            background: var(--card-white); border: 1px solid var(--card-border);
            border-radius: 14px; padding: 8px 14px;
            font-family: inherit; font-weight: 700; font-size: 0.8rem;
            color: var(--text-main); cursor: pointer;
            box-shadow: var(--card-shadow);
            transition: transform 0.15s ease;
            display: flex; align-items: center; gap: 6px;
        }
        .back-btn:active { transform: scale(0.95); }

        .toolbar-row {
            display: flex; justify-content: space-between; align-items: center;
            flex-wrap: wrap; gap: 8px; margin-bottom: 12px;
        }
        .legend-bar {
            display: flex; gap: 12px; font-size: 0.68rem; font-weight: 700;
            color: var(--text-muted); background: var(--card-white);
            padding: 5px 12px; border-radius: 20px;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow);
        }
        .legend-item { display: flex; align-items: center; gap: 5px; }
        .legend-box { width: 12px; height: 12px; border-radius: 4px; border: 1px solid; }
        .legend-box.raw { background: var(--raw-bg); border-color: var(--raw-border); }
        .legend-box.konv { background: var(--konv-bg); border-color: var(--konv-border); }

        .view-toggle { display: flex; gap: 6px; }
        .view-toggle .vt-btn {
            background: var(--card-white); border: 1px solid var(--card-border);
            border-radius: 18px; padding: 5px 12px;
            font-family: inherit; font-weight: 700; font-size: 0.7rem;
            color: var(--text-muted); cursor: pointer;
            box-shadow: var(--card-shadow); transition: all 0.2s ease;
        }
        .view-toggle .vt-btn:active { transform: scale(0.95); }
        .view-toggle .vt-btn.active {
            background: var(--primary-blue); color: #ffffff;
            border-color: var(--primary-blue);
        }

        /* ===== PRODUCTS ===== */
        .products-grid { display: flex; flex-direction: column; gap: 10px; }
        .product-card {
            background: var(--card-white); border-radius: 18px;
            padding: 12px 16px; display: flex; align-items: center;
            justify-content: space-between;
            border: 1px solid var(--card-border);
            box-shadow: var(--card-shadow); gap: 12px;
        }
        .product-info-col { display: flex; flex-direction: column; gap: 4px; }
        .brand-mini-tag {
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.5px; color: var(--primary-blue);
        }
        .product-card-title { font-size: 0.88rem; font-weight: 700; line-height: 1.35; }
        .plu-badges-stack {
            display: flex; flex-direction: column; gap: 4px;
            align-items: flex-end; flex-shrink: 0;
        }
        .plu-badge-button {
            padding: 5px 12px; border-radius: 8px;
            font-family: var(--font-code); font-size: 0.76rem; font-weight: 700;
            border: 1px solid transparent; cursor: pointer;
            transition: all 0.15s ease;
        }
        .plu-badge-button:active { transform: scale(0.95); }
        .plu-raw-style { background: var(--raw-bg); border-color: var(--raw-border); color: var(--raw-text); }
        .plu-konv-style { background: var(--konv-bg); border-color: var(--konv-border); color: var(--konv-text); }
        .plu-copied-style { background: #dcfce7 !important; border-color: #86efac !important; color: #15803d !important; }

        /* ===== TABLE ===== */
        .table-wrapper {
            background: var(--card-white); border-radius: 16px;
            border: 1px solid var(--card-border); overflow: hidden;
            box-shadow: var(--card-shadow);
        }
        .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
        .table-scroll table { width: 100%; border-collapse: collapse; font-size: 0.78rem; min-width: 340px; }
        .table-scroll th {
            text-align: left; padding: 10px 12px 8px 12px;
            font-size: 0.65rem; font-weight: 800; text-transform: uppercase;
            letter-spacing: 0.4px; color: var(--text-light);
            border-bottom: 2px solid var(--card-border); background: #f8fafc;
        }
        .table-scroll td {
            padding: 8px 12px; border-bottom: 1px solid var(--card-border);
            vertical-align: middle;
        }
        .table-scroll tr:last-child td { border-bottom: none; }
        .table-scroll .plu-badge-button {
            display: inline-block; font-size: 0.65rem;
            padding: 3px 8px; margin: 1px 2px 1px 0;
        }
        .table-scroll .row-number {
            font-size: 0.65rem; color: var(--text-light);
            font-weight: 700; width: 28px; text-align: center;
        }
        .table-scroll .item-name { font-weight: 700; font-size: 0.8rem; }

        /* ===== SHEET TABS ===== */
        .sheet-tabs {
            display: flex; gap: 6px; overflow-x: auto;
            padding-bottom: 8px; margin-bottom: 12px;
            scrollbar-width: none;
            border-bottom: 2px solid var(--card-border);
        }
        .sheet-tabs::-webkit-scrollbar { display: none; }
        .sheet-tab {
            padding: 8px 16px; border-radius: 10px 10px 0 0;
            font-size: 0.78rem; font-weight: 700; color: var(--text-muted);
            cursor: pointer; white-space: nowrap;
            border: 1px solid transparent; border-bottom: none;
            transition: all 0.2s ease; background: transparent;
            display: flex; align-items: center; gap: 6px;
        }
        .sheet-tab .tab-count {
            font-size: 0.6rem; color: var(--text-light);
            background: var(--bg-app); padding: 1px 8px; border-radius: 10px;
        }
        .sheet-tab.active {
            color: var(--text-main); background: var(--card-white);
            border-color: var(--card-border); font-weight: 800;
        }
        .sheet-tab.active .tab-count { background: var(--primary-blue); color: white; }
        .sheet-tab:active { transform: scale(0.95); }
        .sheet-tab.bread.active { border-top: 3px solid #8c5332; }
        .sheet-tab.burger.active { border-top: 3px solid #e11d48; }
        .sheet-tab.yummy.active { border-top: 3px solid #f97316; }
        .sheet-tab.coffee.active { border-top: 3px solid #d97706; }
        .sheet-tab.pointcoffee.active { border-top: 3px solid #15803d; }
        .sheet-tab.hambalanfc.active { border-top: 3px solid #1e40af; }
        .sheet-tab.perishable.active { border-top: 3px solid #059669; }
        .sheet-tab.all-brand.active { border-top: 3px solid var(--primary-blue); }

        /* ================================================================
           KALKULATOR SO — SOFT BLUE ISLAND
           ================================================================ */
        #kalkulatorView .calc-shell {
            height: calc(100vh - 160px); height: calc(100dvh - 160px);
            min-height: 470px;
            background: linear-gradient(145deg, #ffffff, #f0f4ff);
            border: 1px solid var(--card-border);
            box-shadow: 0 8px 30px rgba(0, 115, 234, 0.08);
            border-radius: 24px;
            padding: 14px;
            display: flex; flex-direction: column;
            overflow: hidden; color: var(--text-main);
        }
        .calc-display { text-align: center; flex-shrink: 0; }
        .calc-context {
            display: inline-flex; align-items: center; gap: 6px;
            color: var(--text-muted); font-size: 13px; font-weight: 700;
            margin-bottom: 6px; max-width: 94%;
        }
        .calc-context b { color: var(--text-main); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

        .display-value {
            font-size: 46px; font-weight: 800; letter-spacing: -1px; line-height: 1.1;
            font-variant-numeric: tabular-nums; color: var(--primary-blue);
        }
        .display-value .unit { font-size: 20px; font-weight: 700; color: var(--text-light); margin-left: 5px; }
        .display-value.danger { color: #ef4444; font-size: 30px; }

        .display-meta {
            display: flex; justify-content: center; align-items: center;
            gap: 7px; margin-top: 10px; flex-wrap: wrap;
        }
        .input-chip {
            display: inline-flex; align-items: center; gap: 6px;
            background: var(--bg-app); border: 1px solid var(--card-border);
            color: var(--text-muted); font-size: 11.5px; font-weight: 700;
            padding: 5px 12px; border-radius: 999px;
            font-variant-numeric: tabular-nums;
        }
        .input-chip b { color: var(--text-main); }
        .input-chip.amber b { color: #d97706; }
        .input-chip.blue b { color: var(--primary-blue); }
        .input-chip.danger, .input-chip.danger b { color: #ef4444; border-color: rgba(239,68,68,0.35); }
        .display-divider {
            height: 2px;
            background: linear-gradient(to right, rgba(0,115,234,0.08), rgba(0,115,234,0.25), rgba(0,115,234,0.08));
            margin-top: 12px; border-radius: 2px;
        }
        .kc-dot { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 2px; }
        .kc-dot.raw { background: var(--raw-bg); border: 1px solid var(--raw-border); }
        .kc-dot.konv { background: var(--konv-bg); border: 1px solid var(--konv-border); }

        .mode-pills {
            display: flex; gap: 8px; overflow-x: auto;
            scrollbar-width: none; flex-shrink: 0; padding: 12px 0 2px;
        }
        .mode-pills::-webkit-scrollbar { display: none; }
        .mode-pill {
            font-family: inherit; display: flex; align-items: center; gap: 7px;
            background: var(--card-white); border: 1.5px solid var(--card-border);
            box-shadow: var(--card-shadow);
            padding: 9px 16px; border-radius: 999px;
            font-size: 13.5px; font-weight: 700; color: var(--text-muted);
            cursor: pointer; white-space: nowrap; user-select: none; flex-shrink: 0;
            transition: all 0.2s ease;
        }
        .mode-pill:active { transform: scale(0.95); }
        .mode-pill[data-mode="gramasi"].active { border-color: var(--primary-blue); color: var(--primary-blue); background: rgba(0,115,234,0.07); }
        .mode-pill[data-mode="biang"].active   { border-color: #d97706; color: #d97706; background: rgba(217,119,6,0.07); }
        .mode-pill[data-mode="seal"].active    { border-color: #6366f1; color: #6366f1; background: rgba(99,102,241,0.07); }

        /* PILLS PILIH WADAH (semua wadah, tap langsung) */
        .wadah-strip {
            display: flex; gap: 8px; overflow-x: auto;
            scrollbar-width: none; flex-shrink: 0; padding: 10px 2px 4px;
        }
        .wadah-strip::-webkit-scrollbar { display: none; }
        .w-chip {
            font-family: inherit; background: var(--card-white);
            border: 1.5px solid var(--card-border);
            box-shadow: var(--card-shadow);
            color: var(--text-main); font-size: 12px; font-weight: 700;
            padding: 8px 13px; border-radius: 999px;
            cursor: pointer; user-select: none; flex-shrink: 0; white-space: nowrap;
            transition: transform 0.1s ease, border-color 0.15s ease, color 0.15s ease, background 0.15s ease;
        }
        .w-chip:active { transform: scale(0.94); }
        .w-chip.active {
            border-color: var(--primary-blue); color: var(--primary-blue);
            background: rgba(0,115,234,0.06);
        }

        .mode-content {
            flex: 1; min-height: 0; overflow-y: auto;
            padding: 10px 2px 4px;
            overscroll-behavior: contain; -webkit-overflow-scrolling: touch;
        }
        .mode-content::-webkit-scrollbar { width: 0; }
        #mode-gramasi { display: flex; flex-direction: column; height: 100%; min-height: 0; }

        .field-chip {
            width: 100%; display: flex; justify-content: space-between; align-items: center;
            background: var(--card-white); border: 1.5px solid var(--card-border);
            box-shadow: var(--card-shadow);
            border-radius: 14px;
            padding: 12px 14px; margin-bottom: 8px; cursor: pointer;
            font-family: inherit; font-size: 13px; font-weight: 700; color: var(--text-main);
            transition: all 0.2s ease; user-select: none;
        }
        .field-chip:active { transform: scale(0.98); }
        .field-chip .fc-left { display: flex; align-items: center; gap: 9px; color: var(--text-muted); }
        .field-chip .fc-value { font-size: 16px; font-weight: 800; font-variant-numeric: tabular-nums; }
        .field-chip.active { border-color: #d97706; background: rgba(217,119,6,0.06); }
        .field-chip.active .fc-left { color: #d97706; }

        .seal-progress { height: 12px; background: #e5e7eb; border-radius: 999px; overflow: hidden; margin: 6px 0; }
        .seal-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #6366f1, #8b5cf6); border-radius: 999px; transition: width 0.25s ease; }
        .seal-fill.danger { background: #ef4444; }
        .seal-scale { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-light); font-weight: 700; }
        .seal-tip { text-align: center; font-size: 11px; color: var(--text-muted); font-weight: 600; margin-top: 16px; }

        /* PLU Point Coffee (di dalam mode gramasi) */
        .kc-search {
            width: 100%; padding: 11px 14px; border-radius: 12px;
            background: var(--card-white); border: 1.5px solid var(--card-border);

    /* ================================================================

    function $(id) { return document.getElementById(id); }

    function escapeHtml(str) {
        if (!str) return '';
        return String(str).replace(/[&<>"']/g, function(m) {
            return { '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[m];
        });
    }

    function debounce(fn, wait) {
        var t;
        return function() {
            var ctx = this, args = arguments;
            clearTimeout(t);
            t = setTimeout(function() { fn.apply(ctx, args); }, wait);
        };
    }

    function copyToClipboard(text) {
        if (navigator.clipboard && navigator.clipboard.writeText) {
            return navigator.clipboard.writeText(text);
        }
        return new Promise(function(resolve) {
            var ta = document.createElement('textarea');
            ta.value = text;
            ta.style.position = 'fixed';
            ta.style.opacity = '0';
            document.body.appendChild(ta);
            ta.select();
            try { document.execCommand('copy'); } catch(e) {}
            document.body.removeChild(ta);
            resolve();
        });
    }

    /* ================================================================
       KALKULATOR SO (SOFT BLUE ISLAND)
       ================================================================ */
    var calcState = {
        mode: 'gramasi',
        gramasi: '932',
        wadahAktif: dataWadah[0].nama,
        biangTimbangan: '947',
        biangBotol: '680',
        biangField: 'timbangan',
        seal: '10'
    };

    (function() {
        try {
            var s = localStorage.getItem('plukakang_kalk_v4');
            if (s) {
                var o = JSON.parse(s);
                for (var k in calcState) {
                    if (o[k] !== undefined && o[k] !== null) calcState[k] = o[k];
                }
                var found = dataWadah.some(function(w) { return w.nama === calcState.wadahAktif; });
                if (!found) calcState.wadahAktif = dataWadah[0].nama;
            }
        } catch(e) {}
        if (['gramasi', 'biang', 'seal'].indexOf(calcState.mode) === -1) calcState.mode = 'gramasi';
    })();

    function calcPersist() {
        try { localStorage.setItem('plukakang_kalk_v4', JSON.stringify(calcState)); } catch(e) {}
    }

    function fmt(n) { return n.toLocaleString('id-ID'); }
    function vibrate() { try { if (navigator.vibrate) navigator.vibrate(8); } catch(e) {} }

    function findWadah(nama) {
        for (var i = 0; i < dataWadah.length; i++) {
            if (dataWadah[i].nama === nama) return dataWadah[i];
        }
        return null;
    }

    function hitungBersih(w, input) {
        var isYakult = w.nama.indexOf('Yakult') !== -1;
        return isYakult ? Math.round(input * w.mj) : Math.round((input - w.tare) * w.mj);
    }

    function mjDisplay(mj) {
        return (mj % 1 === 0) ? mj.toString() : mj.toString().replace('.', ',');
    }

    function calcActiveField() {
        if (calcState.mode === 'gramasi') return 'gramasi';
        if (calcState.mode === 'seal') return 'seal';
        return calcState.biangField === 'botol' ? 'biangBotol' : 'biangTimbangan';
    }

    function pressKey(k) {
        vibrate();
        var f = calcActiveField();
        var cur = calcState[f];

        if (k === 'C') cur = '0';
        else if (k === 'back') cur = cur.length > 1 ? cur.slice(0, -1) : '0';
        else {
            if (cur === '0') cur = k;
            else if (cur.length < 6) cur += k;
            else return;
        }

        calcState[f] = cur;
        calcPersist();
        calcRender();
    }

    function calcRender() {
        var value = $('displayValue');
        var meta = $('displayMeta');
        var prefix = $('selectorPrefix');

        if (calcState.mode === 'gramasi') {
            prefix.innerText = 'Bersih ·';
            var w = findWadah(calcState.wadahAktif) || dataWadah[0];
            var input = parseFloat(calcState.gramasi) || 0;
            var bersih = hitungBersih(w, input);

            $('selectorName').innerText = w.nama;
            value.innerHTML = fmt(bersih) + '<span class="unit">gr</span>';
            value.classList.toggle('danger', bersih < 0);

            meta.innerHTML =
                '<span class="input-chip"><i class="fas fa-weight-scale"></i> Timbangan <b>' + escapeHtml(calcState.gramasi) + ' gr</b></span>' +
                '<span class="input-chip">Tare <b>' + (w.tare === 0 ? '-' : w.tare) + '</b></span>' +
                '<span class="input-chip">MJ <b>' + mjDisplay(w.mj) + '</b></span>' +
                (bersih < 0 ? '<span class="input-chip danger">Berat di bawah tare!</span>' : '');

        } else if (calcState.mode === 'biang') {
            prefix.innerText = 'Netto ·';
            var t = parseFloat(calcState.biangTimbangan) || 0;
            var b = parseFloat(calcState.biangBotol) || 0;
            var netto = Math.max(0, t - b);
            var kopi = Math.round(netto * 0.3);

            $('selectorName').innerText = 'SO Biang Kopi';
            value.innerHTML = fmt(netto) + '<span class="unit">gr</span>';
            value.classList.remove('danger');
            meta.innerHTML =
                '<span class="input-chip amber">☕ Biji Kopi <b>' + fmt(kopi) + ' gr</b></span>' +
                '<span class="input-chip blue">💧 Air Mineral <b>' + fmt(netto - kopi) + ' gr</b></span>';

            $('chipValTimbangan').innerText = calcState.biangTimbangan;
            $('chipValBotol').innerText = calcState.biangBotol;

        } else { /* seal */
            prefix.innerText = 'Cup ·';
            var v = parseInt(calcState.seal) || 0;
            var over = v > 35;
            var fill = $('sealFill');

            fill.style.width = (Math.min(Math.max(v, 0), 35) / 35 * 100) + '%';
            fill.classList.toggle('danger', over);

            $('selectorName').innerText = 'Plastik Seal';
            if (over) {
                value.innerHTML = 'Maks 35 mm';
                value.classList.add('danger');
                meta.innerHTML = '<span class="input-chip danger">Tebalan <b>' + escapeHtml(calcState.seal) + ' mm</b> — melebihi batas</span>';
            } else {
                value.innerHTML = (v ? fmt(DEFAULT_SEAL[v]) : '0') + '<span class="unit">cup</span>';
                value.classList.remove('danger');
                meta.innerHTML = '<span class="input-chip">Tebalan roll <b>' + escapeHtml(calcState.seal) + ' mm</b></span>';
            }
        }
    }

    function setCalcMode(mode) {
        calcState.mode = mode;
        calcPersist();

        var pills = document.querySelectorAll('#modePills .mode-pill');
        for (var i = 0; i < pills.length; i++) {
            pills[i].classList.toggle('active', pills[i].dataset.mode === mode);
        }

        var isGramasi = (mode === 'gramasi');
        $('wadahStrip').classList.toggle('hidden', !isGramasi);
        $('mode-gramasi').classList.toggle('hidden', !isGramasi);
        $('mode-biang').classList.toggle('hidden', mode !== 'biang');
        $('mode-seal').classList.toggle('hidden', mode !== 'seal');

        $('modeContent').scrollTop = 0;
        calcRender();
    }

    /* PILLS PILIH WADAH — semua wadah, tap langsung pilih */
    function renderWadahStrip() {
        var html = '';
        dataWadah.forEach(function(w) {
            html += '<button class="w-chip' + (w.nama === calcState.wadahAktif ? ' active' : '') +
                    '" data-nama="' + escapeHtml(w.nama) + '">' + escapeHtml(w.nama) + '</button>';
        });
        $('wadahStrip').innerHTML = html;

    function scrollWadahAktif() {
        var chip = document.querySelector('#wadahStrip .w-chip.active');
        if (chip && chip.scrollIntoView) {
            chip.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
        }
    }

    function pilihWadah(nama) {
        vibrate();
        calcState.wadahAktif = nama;
        calcPersist();
        renderWadahStrip();
        scrollWadahAktif();
        calcRender();
    }

    function syncBiangChips() {
        $('chipTimbangan').classList.toggle('active', calcState.biangField === 'timbangan');
        $('chipBotol').classList.toggle('active', calcState.biangField === 'botol');
    }

    function attachCalcEvents() {
        $('keypad').addEventListener('click', function(e) {
            var k = e.target.closest('.key');
            if (k) pressKey(k.dataset.key);
        });

        $('modePills').addEventListener('click', function(e) {
            var p = e.target.closest('.mode-pill');
            if (p && p.dataset.mode !== calcState.mode) setCalcMode(p.dataset.mode);
        });

        /* Tap chip wadah = langsung pilih */
        $('wadahStrip').addEventListener('click', function(e) {
            var chip = e.target.closest('.w-chip');
            if (chip && chip.dataset.nama) pilihWadah(chip.dataset.nama);
        });

        $('chipTimbangan').addEventListener('click', function() {
            vibrate(); calcState.biangField = 'timbangan';
            syncBiangChips(); calcPersist(); calcRender();
        });
        $('chipBotol').addEventListener('click', function() {
            vibrate(); calcState.biangField = 'botol';
            syncBiangChips(); calcPersist(); calcRender();
        });
    }

    function calcInit() {
        syncBiangChips();
        renderWadahStrip();
        attachCalcEvents();
        initKcAlpha();
        setCalcMode(calcState.mode);
        scrollWadahAktif();
    }

    /* ================================================================
       LOAD DATA JSON
       ================================================================ */
    function loadData() {
        fetch('data.json')
            .then(function(res) {
                if (!res.ok) throw new Error('HTTP ' + res.status);
                return res.json();
            })
            .then(function(data) {
                data.sort(function(a, b) {
                    return a.nama.toLowerCase().localeCompare(b.nama.toLowerCase());
                });
                DATABASE = data;

                pointCoffeeData = data.filter(function(item) {
                    return (item.brand === 'pointcoffee' || item.brand === 'point coffee') && item.sub !== 'sarana';
                });
                pointCoffeeData.sort(function(a, b) {
                    return a.nama.toLowerCase().localeCompare(b.nama.toLowerCase());
                });

                renderDataGrid();
                renderKatalog();
                renderSidebarPlu('');
                renderSidebarAlphaNav();
            })
            .catch(function(err) {
                console.error('Gagal load data.json:', err);
                $('sidebarPluList').innerHTML =
                    '<div class="plu-empty">Gagal load data. Pastikan file data.json ada.</div>';
            });
    }

    /* ================================================================
       RENDER DATA GRID
       ================================================================ */
    function renderDataGrid() {
        var query = $('searchInput').value.toLowerCase().trim();
        var counterBadge = $('itemCounterBadge');

        if (currentBrand === '' && query === '' && currentView !== 'katalog') {
            counterBadge.innerText = '0 Item';
            renderAlphabetNav();
            return;
        }

        var cacheKey = currentBrand + '|' + currentSub + '|' + currentKategori + '|' + query;
        if (cacheKey === _renderCache.key) return;

        var filtered = DATABASE.filter(function(item) {
            var matchBrand = (currentBrand === '' || currentBrand === 'all' || item.brand === currentBrand);
            var matchSub = (currentSub === 'all' || item.sub === currentSub);
            var matchKat = (currentKategori === 'all' || item.kategori === currentKategori);
            var searchString = (item.nama + ' ' + (item.raw || '') + ' ' + (item.konv || '')).toLowerCase();
            var matchQuery = (query === '' || searchString.indexOf(query) !== -1);
            return matchBrand && matchSub && matchKat && matchQuery;
        });

        counterBadge.innerText = filtered.length + ' Item';

        if (filtered.length === 0) {
            $('productGrid').innerHTML = '<div class="empty-search-state">Barang yang Anda cari tidak ditemukan.</div>';
            $('tableBody').innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-muted);">Barang tidak ditemukan</td></tr>';
            _renderCache.key = cacheKey;
            renderAlphabetNav();
            return;
        }

        var html = '';
        var tableHtml = '';
        filtered.forEach(function(item, i) {
            var badgesHtml = '';
            if (item.raw) badgesHtml += '<button class="plu-badge-button plu-raw-style" data-plu="' + escapeHtml(item.raw) + '">' + item.raw + '</button>';
            if (item.konv) badgesHtml += '<button class="plu-badge-button plu-konv-style" data-plu="' + escapeHtml(item.konv) + '">' + item.konv + '</button>';

            html += '<div class="product-card">' +

                    '<div class="product-card-title">' + escapeHtml(item.nama) + '</div>' +
                '</div>' +
                '<div class="plu-badges-stack">' + badgesHtml + '</div>' +
            '</div>';

            var rawHtml = item.raw ? '<button class="plu-badge-button plu-raw-style" data-plu="' + escapeHtml(item.raw) + '">' + item.raw + '</button>' : '-';
            var konvHtml = item.konv ? '<button class="plu-badge-button plu-konv-style" data-plu="' + escapeHtml(item.konv) + '">' + item.konv + '</button>' : '-';
            tableHtml += '<tr>' +
                '<td class="row-number">' + (i + 1) + '</td>' +
                '<td><div class="item-name">' + escapeHtml(item.nama) + '</div></td>' +
                '<td>' + rawHtml + '</td>' +
                '<td>' + konvHtml + '</td>' +
            '</tr>';
        });

        $('productGrid').innerHTML = html;
        $('tableBody').innerHTML = tableHtml;

        _renderCache.key = cacheKey;
        renderAlphabetNav();
    }

        currentSheet = brand;
        var tabs = document.querySelectorAll('#sheetTabs .sheet-tab');
        for (var i = 0; i < tabs.length; i++) {
            tabs[i].classList.toggle('active', tabs[i].dataset.sheet === brand);
        }
        _katalogCache.key = '';
        renderSheetData();
    }

    function renderSheetData() {
        var listGrid = $('katalogListGrid');
        var tableBody = $('katalogTableBody');

        var query = $('searchInput').value.toLowerCase().trim();
        var items = katalogData[currentSheet] || [];

        if (query !== '') {
            items = items.filter(function(item) {
                var searchString = (item.nama + ' ' + (item.raw || '') + ' ' + (item.konv || '')).toLowerCase();
                return searchString.indexOf(query) !== -1;
            });
        }

        var cacheKey = currentSheet + '|' + query + '|' + items.length;
        if (cacheKey === _katalogCache.key) return;

        if (items.length === 0) {
            listGrid.innerHTML = '<div class="empty-search-state">' +
                (query !== '' ? 'Barang yang Anda cari tidak ditemukan.' : 'Tidak ada PLU di brand ini.') +
            '</div>';
            tableBody.innerHTML = '<tr><td colspan="4" style="text-align:center;padding:20px;color:var(--text-muted);">Tidak ada data</td></tr>';
            $('katalogCounter').textContent = '0 Item';
            _katalogCache.key = cacheKey;
            renderAlphabetNav();
            return;
        }

        $('katalogCounter').textContent = items.length + ' Item';

        var needGrouping = (currentSheet === 'yummychoice' || currentSheet === 'yummycoffee' || currentSheet === 'pointcoffee' || currentSheet === 'hambalanfc' || currentSheet === 'perishable');
        var kategoriSet = {};
        if (needGrouping) {
            items.forEach(function(item) {
                if (item.kategori && !kategoriSet[item.kategori]) kategoriSet[item.kategori] = true;
            });
        }
        var kategoriKeys = Object.keys(kategoriSet);
        var hasKategori = needGrouping && kategoriKeys.length > 0;

        var labelMap = {};
        if (currentSheet === 'yummychoice') labelMap = KATEGORI_LABEL;
        else if (currentSheet === 'yummycoffee') labelMap = KATEGORI_LABEL_COFFEE;
        else if (currentSheet === 'pointcoffee') labelMap = KATEGORI_LABEL_POINT;
        else if (currentSheet === 'perishable') labelMap = KATEGORI_LABEL_PERISHABLE;

        var listHtml = '';
        var tableHtml = '';
        var rowCounter = 0;

        function renderItem(item) {
            var badges = '';
            if (item.raw) badges += '<button class="plu-badge-button plu-raw-style" data-plu="' + escapeHtml(item.raw) + '">' + item.raw + '</button>';
            if (item.konv) badges += '<button class="plu-badge-button plu-konv-style" data-plu="' + escapeHtml(item.konv) + '">' + item.konv + '</button>';

            listHtml += '<div class="product-card">' +
                '<div class="product-info-col">' +
                    '<span class="brand-mini-tag">' + (BRAND_NAMES[item.brand] || item.brand) + '</span>' +
                    '<div class="product-card-title">' + escapeHtml(item.nama) + '</div>' +
                '</div>' +
                '<div class="plu-badges-stack">' + badges + '</div>' +
            '</div>';

            rowCounter++;
            var rawHtml = item.raw ? '<button class="plu-badge-button plu-raw-style" data-plu="' + escapeHtml(item.raw) + '">' + item.raw + '</button>' : '-';
            var konvHtml = item.konv ? '<button class="plu-badge-button plu-konv-style" data-plu="' + escapeHtml(item.konv) + '">' + item.konv + '</button>' : '-';
            tableHtml += '<tr>' +
                '<td class="row-number">' + rowCounter + '</td>' +
                '<td><div class="item-name">' + escapeHtml(item.nama) + '</div></td>' +
                '<td>' + rawHtml + '</td>' +
                '<td>' + konvHtml + '</td>' +
            '</tr>';
        }

        if (hasKategori) {
            kategoriKeys.forEach(function(kat) {
                var katItems = items.filter(function(item) { return item.kategori === kat; });
                if (katItems.length === 0) return;

                var label = labelMap[kat] || kat;
                if (currentSheet === 'hambalanfc') label = kat.charAt(0).toUpperCase() + kat.slice(1);

                listHtml += '<div class="section-bar" style="margin-top:10px;"><span class="section-title" style="font-size:0.85rem;color:var(--primary-blue);">' + label + ' (' + katItems.length + ')</span></div>';
                tableHtml += '<tr><td colspan="4" style="padding:8px 12px 4px 12px;font-weight:800;font-size:0.8rem;color:var(--primary-blue);background:#f8fafc;border-bottom:2px solid var(--card-border);">' + label + ' (' + katItems.length + ')</td></tr>';

                katItems.forEach(renderItem);
            });
        } else {
            items.forEach(renderItem);
        }

        listGrid.innerHTML = listHtml;
        tableBody.innerHTML = tableHtml;

        _katalogCache.key = cacheKey;
        renderAlphabetNav();
    }

    /* ================================================================
       EVENT DELEGATION
       ================================================================ */
    document.addEventListener('click', function(e) {
        var brandCard = e.target.closest('.brand-card');
        if (brandCard && brandCard.dataset.brand) {
            openBrandCategory(brandCard.dataset.brand);
            return;
        }

        var pill = e.target.closest('#subPillsContainer .pill-button');
        if (pill) {
            var allPills = document.querySelectorAll('#subPillsContainer .pill-button');
            for (var j = 0; j < allPills.length; j++) allPills[j].classList.remove('active');
            pill.classList.add('active');
            currentSub = pill.dataset.pillId;
            currentKategori = 'all';
            _renderCache.key = '';
            renderKategoriPills();
            renderDataGrid();
            return;
        }

        var katPill = e.target.closest('#kategoriPillsContainer .pill-button');
        if (katPill) {
            var allKat = document.querySelectorAll('#kategoriPillsContainer .pill-button');
            for (var k = 0; k < allKat.length; k++) allKat[k].classList.remove('active');
            katPill.classList.add('active');
            currentKategori = katPill.dataset.katId;
            _renderCache.key = '';
            renderDataGrid();
            return;
        }

        var sheetTab = e.target.closest('#sheetTabs .sheet-tab');
        if (sheetTab) {
            switchSheet(sheetTab.dataset.sheet);
            return;
        }

        var pluBtn = e.target.closest('.plu-badge-button[data-plu]');
        if (pluBtn) {
            var code = pluBtn.dataset.plu;
            copyToClipboard(code).then(function() {
                var originalText = pluBtn.innerText;
                pluBtn.innerText = '✓';
                pluBtn.classList.add('plu-copied-style');
                showToast('PLU ' + code + ' Disalin! ✓');
                setTimeout(function() {
                    pluBtn.innerText = originalText;
                    pluBtn.classList.remove('plu-copied-style');
                }, 1000);
            });
            return;
        }

        var sidebarPlu = e.target.closest('.plu-code[data-plu]');
        if (sidebarPlu) {
            var code2 = sidebarPlu.dataset.plu;
            copyToClipboard(code2).then(function() {
                var original = sidebarPlu.innerText;
                sidebarPlu.innerText = '✓';
                sidebarPlu.style.background = '#dcfce7';
                sidebarPlu.style.color = '#15803d';
                showToast('PLU ' + code2 + ' Disalin! ✓');
                setTimeout(function() {
                    sidebarPlu.innerText = original;
                    sidebarPlu.style.background = '';
                    sidebarPlu.style.color = '';
                }, 1000);
            });
            return;
        }
    });

    /* ================================================================
       SEARCH
       ================================================================ */
    var searchInput = $('searchInput');
    var searchClearBtn = $('searchClearBtn');

    var handleSearch = debounce(function() {
        if (currentView === 'katalog') {
            _katalogCache.key = '';
            renderSheetData();
        } else if (currentView === 'detail' || currentView === 'home') {
            var query = searchInput.value.trim();
            if (query !== '' && currentView === 'home' && currentBrand === '') {
                $('homeView').style.display = 'none';
                $('detailView').style.display = 'block';
                $('katalogView').style.display = 'none';
                $('kalkulatorView').style.display = 'none';
                $('greetingWrapper').classList.add('hidden');
                $('globalSearchBar').style.display = '';
                $('detailHeadingTitle').innerText = 'Hasil Pencarian';
                $('subPillsContainer').style.display = 'none';
                $('kategoriPillsContainer').style.display = 'none';
                currentView = 'detail';
            } else if (query === '' && currentView === 'detail' && currentBrand === '') {
                $('homeView').style.display = 'block';
                $('detailView').style.display = 'none';
                $('katalogView').style.display = 'none';
                $('kalkulatorView').style.display = 'none';
                $('greetingWrapper').classList.remove('hidden');
                currentView = 'home';
            }
            _renderCache.key = '';
            renderDataGrid();
        }
        toggleAlphabetNav();
    }, 120);

    searchInput.addEventListener('input', function() {
        searchClearBtn.style.display = searchInput.value.trim() !== '' ? 'flex' : 'none';
        handleSearch();
    });

    function clearSearchInput() {
        searchInput.value = '';
        searchClearBtn.style.display = 'none';
        _renderCache.key = '';
        _katalogCache.key = '';
        if (currentView === 'katalog') {
            renderSheetData();
        } else {
            if (currentView === 'detail' && currentBrand === '') {
                $('homeView').style.display = 'block';
                $('detailView').style.display = 'none';
                $('katalogView').style.display = 'none';
                $('kalkulatorView').style.display = 'none';
                $('greetingWrapper').classList.remove('hidden');
                currentView = 'home';
            }
            renderDataGrid();
        }
        toggleAlphabetNav();
    }

    /* Search PLU (mode gramasi) */
    var handleSidebarSearch = debounce(function() {
        renderSidebarPlu($('sidebarSearchPlu').value);
    }, 100);
    $('sidebarSearchPlu').addEventListener('input', handleSidebarSearch);

    /* ================================================================
       GREETING & CLOCK
       ================================================================ */
    var _lastClockSecond = -1;
    function updateClock() {
        var now = new Date();
        if (now.getSeconds() === _lastClockSecond) return;
        _lastClockSecond = now.getSeconds();

        var hari = ['Minggu','Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];
        var bulan = ['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
        var tanggal = hari[now.getDay()] + ', ' + now.getDate() + ' ' + bulan[now.getMonth()] + ' ' + now.getFullYear();
        $('dateDisplay').innerText = '📅 ' + tanggal;
        var jam = String(now.getHours()).padStart(2, '0');
        var menit = String(now.getMinutes()).padStart(2, '0');
        var detik = String(now.getSeconds()).padStart(2, '0');
        $('timeDisplay').innerText = jam + ':' + menit + ':' + detik;
    }
    function clockLoop() {
        updateClock();
        requestAnimationFrame(clockLoop);
    }

    function getSapaanData() {
        var jam = new Date().getHours();
        if (jam >= 0 && jam < 5) return { icon: '🌙', text: 'rek naon ente?' };
        if (jam >= 5 && jam < 11) return { icon: '☀️', text: 'gas urang pulcep!' };
        if (jam >= 11 && jam < 15) return { icon: '🌤️', text: 'aduh, kurang lincah wa!' };
        if (jam >= 15 && jam < 18) return { icon: '🌅', text: 'bau-bau balik burit 😂' };
        return { icon: '🌙', text: 'astaghfirullah, masih gadag wayah gini.' };
    }

    function getCountdownGajian() {
        var now = new Date();
        var gajian = new Date(now.getFullYear(), now.getMonth(), 28);
        if (now > gajian) gajian = new Date(now.getFullYear(), now.getMonth() + 1, 28);
        var selisih = Math.ceil((gajian - now) / (1000 * 60 * 60 * 24));
        if (selisih === 0) return { icon: '🎉', text: 'HARI INI GAJIAN! 🎉🎉🎉' };
        if (selisih === 1) return { icon: '💰', text: '1 hari menuju gajian!' };
        return { icon: '💰', text: selisih + ' hari menuju gajian! 🎉' };
    }

    var isSapaan = true;
    var _sapaanTimer;
    function toggleSapaanCountdown() {
        var s = isSapaan ? getSapaanData() : getCountdownGajian();
        $('sapaanIcon').innerText = s.icon;
        $('sapaanText').innerText = s.text;
        isSapaan = !isSapaan;
        clearTimeout(_sapaanTimer);
        _sapaanTimer = setTimeout(toggleSapaanCountdown, isSapaan ? 3000 : 5000);
    }

    /* ================================================================
       LOGIC FITUR ALPHABET INDEX (Detail/Katalog)
       ================================================================ */
    var activeAlphabet = [];
    var isManualTouch = false;

    function getAvailableAlphabet() {
        var lettersSet = {};
        var items = [];

        if (currentView === 'detail') {
            var query = $('searchInput').value.toLowerCase().trim();
            items = DATABASE.filter(function(item) {
                var matchBrand = (currentBrand === '' || currentBrand === 'all' || item.brand === currentBrand);
                var matchSub = (currentSub === 'all' || item.sub === currentSub);
                var matchKat = (currentKategori === 'all' || item.kategori === currentKategori);
                var searchString = (item.nama + ' ' + (item.raw || '') + ' ' + (item.konv || '')).toLowerCase();
                var matchQuery = (query === '' || searchString.indexOf(query) !== -1);
                return matchBrand && matchSub && matchKat && matchQuery;
            });
        } else if (currentView === 'katalog') {
            var queryKatalog = $('searchInput').value.toLowerCase().trim();
            items = katalogData[currentSheet] || [];
            if (queryKatalog !== '') {
                items = items.filter(function(item) {
                    var searchString = (item.nama + ' ' + (item.raw || '') + ' ' + (item.konv || '')).toLowerCase();
                    return searchString.indexOf(queryKatalog) !== -1;
                });
            }
        }

        items.forEach(function(item) {
            if (item.nama) {
                var firstChar = item.nama.trim().toUpperCase().charAt(0);
                if (/[A-Z]/.test(firstChar)) {
                    lettersSet[firstChar] = true;
                }
            }
        });

        return Object.keys(lettersSet).sort();
    }

    function renderAlphabetNav() {
        var nav = $('alphabetNav');
        if (!nav) return;

        activeAlphabet = getAvailableAlphabet();

        if (activeAlphabet.length === 0) {
            nav.style.display = 'none';
            return;
        }

        var html = '';
        activeAlphabet.forEach(function(letter) {
            html += '<div class="alpha-item" data-letter="' + letter + '" id="alpha-' + letter + '">' + letter + '</div>';
        });
        nav.innerHTML = html;
        toggleAlphabetNav();
    }

    function toggleAlphabetNav() {
        var nav = $('alphabetNav');
        if (!nav) return;
        if ((currentView === 'detail' || currentView === 'katalog') && activeAlphabet.length > 0) {
            nav.style.display = 'flex';
        } else {
            nav.style.display = 'none';
        }
    }

    function setActiveLetter(letter) {
        var items = document.querySelectorAll('.alpha-item');
        for (var i = 0; i < items.length; i++) {
            items[i].classList.remove('active');
        }
        var activeEl = $('alpha-' + letter);
        if (activeEl) activeEl.classList.add('active');
    }

    function scrollToLetter(letter) {
        setActiveLetter(letter);

        var bubble = $('alphaBubble');
        if (bubble) {
            bubble.innerText = letter;
            bubble.classList.add('show');
            clearTimeout(window._bubbleTimer);
            window._bubbleTimer = setTimeout(function() {
                bubble.classList.remove('show');
            }, 700);
        }

        var targets = document.querySelectorAll('.product-card-title, .item-name');
        for (var i = 0; i < targets.length; i++) {
            var text = targets[i].innerText.trim().toUpperCase();
            if (text.startsWith(letter)) {
                targets[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                break;
            }
        }
    }

    function updateActiveLetterOnScroll() {
        if (isManualTouch) return;

        var cards = document.querySelectorAll('.product-card-title, .item-name');
        var currentFirstLetter = '';

        for (var i = 0; i < cards.length; i++) {
            var rect = cards[i].getBoundingClientRect();
            if (rect.top >= 100 && rect.top <= window.innerHeight / 2) {
                var text = cards[i].innerText.trim().toUpperCase();
                if (text.length > 0) {
                    currentFirstLetter = text.charAt(0);
                    break;
                }
            }
        }

        if (currentFirstLetter && activeAlphabet.indexOf(currentFirstLetter) !== -1) {
            setActiveLetter(currentFirstLetter);
        }
    }

    /* Touch Event Navigation A-Z Utama */
    function initAlphabetNavEvents() {
        var nav = $('alphabetNav');
        if (!nav) return;

        function handleTouch(e) {
            e.preventDefault();
            isManualTouch = true;
            var touch = e.touches ? e.touches[0] : e;
            var target = document.elementFromPoint(touch.clientX, touch.clientY);
            if (target && target.classList.contains('alpha-item')) {
                var letter = target.dataset.letter;
                if (letter) scrollToLetter(letter);
            }
        }

        nav.addEventListener('click', function(e) {
            var item = e.target.closest('.alpha-item');
            if (item && item.dataset.letter) {
                scrollToLetter(item.dataset.letter);
            }
        });

        nav.addEventListener('touchstart', handleTouch, { passive: false });
        nav.addEventListener('touchmove', handleTouch, { passive: false });
        nav.addEventListener('touchend', function() {
            setTimeout(function() { isManualTouch = false; }, 400);
        });

        window.addEventListener('scroll', debounce(updateActiveLetterOnScroll, 40));
    }

    /* ================================================================
       ALPHABET INDEX VERTIKAL (PLU di mode Gramasi)
       ================================================================ */
    var kcManualTouch = false;

    function renderSidebarAlphaNav() {
        var nav = $('kcAlphaNav');
        if (!nav) return;
        var set = {};
        pointCoffeeData.forEach(function(item) {
            if (item.nama) {
                var c = item.nama.trim().toUpperCase().charAt(0);
                if (/[A-Z]/.test(c)) set[c] = true;
            }
        });
        var letters = Object.keys(set).sort();
        var html = '';
        letters.forEach(function(l) {
            html += '<div class="kc-alpha-item" data-letter="' + l + '">' + l + '</div>';
        });
        nav.innerHTML = html;
    }

    function kcSetActive(letter) {
        var items = $('kcAlphaNav').querySelectorAll('.kc-alpha-item');
        for (var i = 0; i < items.length; i++) {
            items[i].classList.toggle('active', items[i].dataset.letter === letter);
        }
    }

    function kcScrollTo(letter) {
        kcSetActive(letter);
        var bubble = $('kcAlphaBubble');
        bubble.innerText = letter;
        bubble.classList.add('show');
        clearTimeout(window._kcBubbleTimer);
        window._kcBubbleTimer = setTimeout(function() {
            bubble.classList.remove('show');
        }, 700);

        var names = $('sidebarPluList').querySelectorAll('.plu-name');
        for (var i = 0; i < names.length; i++) {
            if (names[i].innerText.trim().toUpperCase().startsWith(letter)) {
                names[i].scrollIntoView({ behavior: 'smooth', block: 'center' });
                break;
            }
        }
    }

    function initKcAlpha() {
        var nav = $('kcAlphaNav');
        if (!nav) return;

        nav.addEventListener('click', function(e) {
            var it = e.target.closest('.kc-alpha-item');
            if (it && it.dataset.letter) kcScrollTo(it.dataset.letter);
        });

        function kcHandleTouch(e) {
            e.preventDefault();
            kcManualTouch = true;
            var touch = e.touches ? e.touches[0] : e;
            var target = document.elementFromPoint(touch.clientX, touch.clientY);
            if (target && target.classList.contains('kc-alpha-item') && target.dataset.letter) {
                kcScrollTo(target.dataset.letter);
            }
        }
        nav.addEventListener('touchstart', kcHandleTouch, { passive: false });
        nav.addEventListener('touchmove', kcHandleTouch, { passive: false });
        nav.addEventListener('touchend', function() {
            setTimeout(function() { kcManualTouch = false; }, 400);
        });

        /* Auto-highlight huruf saat list di-scroll */
        $('sidebarPluList').addEventListener('scroll', debounce(function() {
            if (kcManualTouch) return;
            var list = $('sidebarPluList');
            var lr = list.getBoundingClientRect();
            var names = list.querySelectorAll('.plu-name');
            var cur = '';
            for (var i = 0; i < names.length; i++) {
                var r = names[i].getBoundingClientRect();
                if (r.top >= lr.top && r.top <= lr.top + lr.height / 2) {
                    cur = names[i].innerText.trim().toUpperCase().charAt(0);
                    break;
                }
            }
            if (cur && /[A-Z]/.test(cur)) kcSetActive(cur);
        }, 40));
    }

    /* ================================================================
       INIT
       ================================================================ */
    renderBrandGrid();
    clockLoop();
    toggleSapaanCountdown();
    calcInit();
    loadData();
    initAlphabetNavEvents();
    </script>
</body>
</html>
