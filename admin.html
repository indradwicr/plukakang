<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0073ea">
<title>Admin PLU — plukakang</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#f6f8fc;--card:#fff;--border:#e5e7eb;--muted:#4b5563;--light:#9ca3af;--blue:#0073ea;--green:#15803d;--red:#ef4444;--amber:#d97706;}
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;touch-action:manipulation;}
  html{-webkit-text-size-adjust:100%;}
  body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,sans-serif;background:var(--bg);color:#111827;display:flex;justify-content:center;padding:16px 12px 48px;-webkit-font-smoothing:antialiased;}
  .wrap{width:100%;max-width:520px;}
  h1{font-size:1.2rem;font-weight:800;letter-spacing:-.3px;}
  .sub{font-size:.75rem;color:var(--muted);margin:4px 0 14px;line-height:1.55;}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-bottom:12px;box-shadow:0 2px 10px rgba(17,24,39,.04);}
  .btn{border:none;border-radius:12px;padding:12px 14px;font-family:inherit;font-size:.83rem;font-weight:800;cursor:pointer;transition:transform .12s ease;}
  .btn:active{transform:scale(.97);}
  .btn-primary{background:var(--blue);color:#fff;}
  .btn-green{background:var(--green);color:#fff;}
  .btn-danger{background:var(--red);color:#fff;}
  .btn-light{background:var(--bg);border:1px solid var(--border);color:#111827;}
  .load-row{display:flex;flex-wrap:wrap;gap:8px;}
  .stat{margin-top:10px;background:var(--bg);border:1px solid var(--border);border-radius:10px;padding:9px 12px;font-size:.72rem;font-weight:700;color:var(--muted);line-height:1.6;}
  .stat b{color:var(--blue);}
  .inp{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-family:inherit;font-size:15px;font-weight:600;outline:none;background:var(--card);color:#111827;}
  .inp:focus{border-color:var(--blue);}
  .chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;margin:10px 0;padding-bottom:2px;}
  .chips::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0;border:1.5px solid var(--border);background:var(--card);border-radius:999px;padding:7px 12px;font-size:.72rem;font-weight:800;color:var(--muted);cursor:pointer;font-family:inherit;}
  .chip.active{border-color:var(--blue);color:var(--blue);background:rgba(0,115,234,.06);}
  .row-btns{display:flex;gap:8px;margin-top:4px;}
  .row-btns .btn{flex:1;}
  h2{font-size:.82rem;font-weight:800;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .tag{font-size:.62rem;font-weight:800;padding:2px 9px;border-radius:8px;background:#fef3c7;color:#a16207;}
  .mini{border:none;background:var(--bg);border-radius:8px;padding:4px 10px;font-size:.68rem;font-weight:800;color:var(--blue);cursor:pointer;font-family:inherit;margin-left:auto;}
  ul.dup{list-style:none;margin-top:8px;max-height:240px;overflow-y:auto;border:1px solid var(--border);border-radius:10px;}
  ul.dup li{padding:8px 12px;font-size:.71rem;line-height:1.5;color:var(--muted);border-bottom:1px solid #f1f5f9;}
  ul.dup li:last-child{border-bottom:none;}
  .item{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:11px 13px;margin-bottom:8px;box-shadow:0 2px 8px rgba(17,24,39,.04);}
  .item-top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .item-name{font-size:.85rem;font-weight:800;line-height:1.35;}
  .bchip{flex-shrink:0;font-size:.6rem;font-weight:800;padding:3px 9px;border-radius:8px;color:#fff;}
  .item-sub{font-size:.68rem;color:var(--muted);font-weight:600;margin-top:2px;}
  .codes{display:flex;gap:6px;margin-top:7px;flex-wrap:wrap;}
  .code{font-family:'JetBrains Mono',monospace;font-size:.68rem;font-weight:700;padding:3px 9px;border-radius:7px;border:1px solid;}
  .code.raw{color:#1d4ed8;background:#eff6ff;border-color:#bfdbfe;}
  .code.konv{color:#a16207;background:#fefce8;border-color:#fef08a;}
  .item-btns{display:flex;gap:8px;margin-top:9px;}
  .item-btns .btn{flex:1;padding:9px;font-size:.75rem;}
  .empty{ text-align:center;color:var(--muted);font-size:.8rem;font-weight:600;padding:24px 10px;background:var(--card);border:1px dashed var(--border);border-radius:14px;}
  .backdrop{position:fixed;inset:0;z-index:150;background:rgba(17,24,39,.45);opacity:0;pointer-events:none;transition:opacity .25s ease;display:flex;align-items:flex-end;justify-content:center;}
  .backdrop.open{opacity:1;pointer-events:auto;}
  .sheet{width:100%;max-width:520px;height:88vh;background:var(--card);border-radius:24px 24px 0 0;display:flex;flex-direction:column;transform:translateY(100%);transition:transform .3s cubic-bezier(.32,.72,0,1);}
  .backdrop.open .sheet{transform:translateY(0);}
  .sheet-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px 10px;}
  .sheet-head b{font-size:1rem;}
  .x{width:34px;height:34px;border-radius:50%;background:var(--bg);border:1px solid var(--border);color:var(--muted);font-size:13px;cursor:pointer;}
  .sheet-body{flex:1;overflow-y:auto;padding:4px 20px 30px;display:flex;flex-direction:column;gap:6px;}
  .sheet-body label{font-size:.72rem;font-weight:800;color:var(--muted);margin-top:8px;}
  .sheet-body select,.sheet-body input{width:100%;padding:12px 14px;border-radius:12px;border:1.5px solid var(--border);font-family:inherit;font-size:15px;font-weight:600;outline:none;background:var(--card);color:#111827;}
  .sheet-body select:focus,.sheet-body input:focus{border-color:var(--blue);}
  .sheet-body .btn{margin-top:14px;}
  .warn{background:#fef3c7;border:1px solid #fde68a;border-radius:10px;padding:10px 12px;font-size:.72rem;color:#a16207;font-weight:700;line-height:1.55;margin-top:10px;}
  .impinfo{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:12px 14px;font-size:.78rem;font-weight:600;color:var(--muted);line-height:1.6;margin-bottom:6px;}
  .impinfo b{color:var(--blue);}
  .impbtns{display:flex;flex-direction:column;gap:8px;}
</style>
</head>
<body>
<div class="wrap">
  <h1>🛠️ Admin PLU</h1>
  <p class="sub">Editor data.json. Semua proses <b>100% di perangkatmu</b> — halaman ini tidak bisa menulis ke server, jadi aman walau diakses siapa pun. Perubahan masuk ke app setelah <b>Export → push data.json ke GitHub</b>.</p>

  <div class="card">
    <div class="load-row">
      <button id="btnLoad" class="btn btn-light">🔄 Muat data live</button>
      <label class="btn btn-light" for="fileJson">📂 File JSON</label>
      <input type="file" id="fileJson" accept=".json" hidden>
      <label class="btn btn-light" for="fileXlsx">📊 Import Excel</label>
      <input type="file" id="fileXlsx" accept=".xlsx,.xls,.csv" hidden>
    </div>
    <div class="stat" id="stats">Belum ada data dimuat…</div>
  </div>

  <div id="editor" style="display:none">
    <div class="card">
      <input id="search" class="inp" placeholder="🔍 Cari nama / PLU RAW / PLU KONV…">
      <div class="chips" id="brandChips"></div>
      <div class="row-btns">
        <button id="btnAdd" class="btn btn-primary">＋ Tambah Item</button>
        <button id="btnExport" class="btn btn-green">💾 Export data.json</button>
      </div>
    </div>

    <div class="card" id="dupCard">
      <h2>⚠️ Cek Duplikat <span class="tag" id="dupCount">0</span><button id="dupToggle" class="mini">tampilkan</button></h2>
      <ul id="dupList" class="dup" style="display:none"></ul>
    </div>

    <div id="list"></div>
  </div>
</div>

<!-- FORM TAMBAH/EDIT -->
<div class="backdrop" id="formBackdrop">
  <div class="sheet">
    <div class="sheet-head"><b id="formTitle">Tambah Item</b><button class="x" id="formClose">✕</button></div>
    <div class="sheet-body">
      <label>Brand *</label><select id="fBrand"></select>
      <label>Sub *</label><select id="fSub"></select>
      <label>Kategori</label><select id="fKat"></select>
      <label>Nama barang *</label><input id="fNama" placeholder="cth: Salt Bread Sesame (28)">
      <label>PLU RAW</label><input id="fRaw" inputmode="numeric" placeholder="cth: 20141111">
      <label>PLU KONV</label><input id="fKonv" inputmode="numeric" placeholder="cth: 20141112 — kosongkan jika tidak ada">
      <div id="formWarn" class="warn" style="display:none"></div>
      <button id="formSave" class="btn btn-primary">💾 Simpan</button>
    </div>
  </div>
</div>

<!-- IMPORT EXCEL -->
<div class="backdrop" id="impBackdrop">
  <div class="sheet" style="height:auto;max-height:80vh;">
    <div class="sheet-head"><b>📊 Import Excel</b><button class="x" id="impClose">✕</button></div>
    <div class="sheet-body">
      <div class="impinfo" id="impInfo"></div>
      <div class="impbtns">
        <button id="impReplace" class="btn btn-danger">🔁 GANTI semua data</button>
        <button id="impAppend" class="btn btn-light">➕ Gabungkan (tambah di akhir)</button>
      </div>
    </div>
  </div>
</div>

<script>
/* ================================================================
   KONFIGURASI — edit di sini kalau brand/sub/kategori berubah.
   Harus sama dengan yang ada di index.html.
   ================================================================ */
var CONFIG = {
  brands: ['saybread','sayburger','yummychoice','yummycoffee','pointcoffee','hambalanfc','perishable'],
  brandNames: { saybread:'Say Bread', sayburger:'Say Burger', yummychoice:'Yummy Choice', yummycoffee:'Yummy Coffee Gold', pointcoffee:'Point Coffee', hambalanfc:'Hambalan FC', perishable:'Perishable' },
  brandColors: { saybread:'#8c5332', sayburger:'#e11d48', yummychoice:'#f97316', yummycoffee:'#d97706', pointcoffee:'#15803d', hambalanfc:'#1e40af', perishable:'#059669' },
  subs: {
    saybread: ['dcf','sarana'],
    sayburger: ['bkl','sarana'],
    yummychoice: ['bkl','sarana'],
    yummycoffee: ['bkl','dcf','sarana'],
    pointcoffee: ['bkl','sarana'],
    hambalanfc: ['minyak','beras','gula','mineral','beverage'],
    perishable: ['buah_sayur']
  },
  subLabels: { dcf:'Frozen Dough', sarana:'Sarana', bkl:'Bahan Baku', minyak:'Minyak', beras:'Beras', gula:'Gula', mineral:'Mineral', beverage:'Beverage', buah_sayur:'Buah & Sayur' },
  kategoriMaps: {
    'yummychoice|bkl': { snack_rte:'Snack RTE', dimsum:'Dimsum', pao:'Pao', fried_chicken:'Fried Chicken', frozen_fc:'Frozen FC', sosis:'Sosis', pizza:'Pizza' },
    'yummycoffee|bkl': { jelly:'Jelly', syrup:'Syrup', powder:'Powder', other:'Other' },
    'pointcoffee|bkl': { coffee_bean:'Coffee Bean', sauce:'Sauce', topping_jelly:'Topping Jelly', syrup:'Syrup', powder:'Powder', milk_dairy:'Milk & Dairy', rtd_beverage:'RTD Beverage', tea:'Tea', sweetener:'Sweetener', topping_crunches:'Topping Crunches', rtd_coffee:'RTD Coffee' },
    'perishable|buah_sayur': { buah:'Buah', sayur:'Sayur', jus:'Jus', bo:'B/O', bp:'B/P' }
  }
};

/* ================================================================ */
var $ = function(id){ return document.getElementById(id); };
var items = [];
var editing = null;   // index item yang sedang diedit, null = mode tambah
var curBrand = 'all';
var pendingImport = null;

/* ---------- LOAD ---------- */
function setData(d) {
  items = d.map(function(it){
    return { brand:it.brand||'', sub:it.sub||'', kategori:it.kategori||'', nama:it.nama||'', raw:it.raw||'', konv:it.konv||'' };
  });
  $('editor').style.display = '';
  renderAll();
}

function loadLive() {
  fetch('data.json?v=' + Date.now())
    .then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
    .then(function(d){ setData(d); })
    .catch(function(){
      alert('Gagal memuat data.json.\n\nKalau kamu membuka halaman ini langsung dari file (bukan lewat vercel.app), pakai tombol "📂 File JSON" untuk memilih data.json dari perangkatmu.');
    });
}
 $('btnLoad').addEventListener('click', loadLive);
 $('fileJson').addEventListener('change', function(e){
  var f = e.target.files[0]; if(!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    try { setData(JSON.parse(ev.target.result)); }
    catch(err){ alert('File bukan JSON valid:\n' + err.message); }
  };
  r.readAsText(f);
  e.target.value = '';
});

/* ---------- RENDER ---------- */
function renderAll() {
  renderStats(); renderChips(); renderList(); renderDup();
}

function renderStats() {
  var per = {};
  CONFIG.brands.forEach(function(b){ per[b] = 0; });
  items.forEach(function(it){ if (per[it.brand] !== undefined) per[it.brand]++; });
  var html = 'Total: <b>' + items.length + '</b> item — ';
  html += CONFIG.brands.map(function(b){ return CONFIG.brandNames[b].split(' ')[0] + ' <b>' + per[b] + '</b>'; }).join(' · ');
  $('stats').innerHTML = html;
}

function renderChips() {
  var html = '<button class="chip' + (curBrand==='all'?' active':'') + '" data-b="all">Semua (' + items.length + ')</button>';
  CONFIG.brands.forEach(function(b){
    var n = items.filter(function(it){ return it.brand === b; }).length;
    html += '<button class="chip' + (curBrand===b?' active':'') + '" data-b="' + b + '">' + CONFIG.brandNames[b] + ' (' + n + ')</button>';
  });
  $('brandChips').innerHTML = html;
}
 $('brandChips').addEventListener('click', function(e){
  var c = e.target.closest('.chip'); if(!c) return;
  curBrand = c.dataset.b;
  renderChips(); renderList();
});

function renderList() {
  var q = $('search').value.toLowerCase().trim();
  var list = items.map(function(it,i){ return {it:it, i:i}; }).filter(function(o){
    var it = o.it;
    if (curBrand !== 'all' && it.brand !== curBrand) return false;
    if (!q) return true;
    return ((it.nama+' '+(it.raw||'')+' '+(it.konv||'')).toLowerCase().indexOf(q) !== -1);
  });

  if (!list.length) {
    $('list').innerHTML = '<div class="empty">' + (items.length ? 'Tidak ada yang cocok dengan pencarian/filter.' : 'Belum ada data. Muat dulu lewat tombol di atas.') + '</div>';
    return;
  }

  $('list').innerHTML = list.map(function(o){
    var it = o.it;
    var color = CONFIG.brandColors[it.brand] || '#6b7280';
    var bname = CONFIG.brandNames[it.brand] || it.brand;
    var subL = CONFIG.subLabels[it.sub] || it.sub || '—';
    var katL = it.kategori ? it.kategori : '';
    var codes = '';
    if (it.raw) codes += '<span class="code raw">RAW ' + it.raw + '</span>';
    if (it.konv) codes += '<span class="code konv">KONV ' + it.konv + '</span>';
    if (!codes) codes = '<span class="code" style="color:#9ca3af;border-color:#e5e7eb;">tanpa PLU ⚠️</span>';
    return '<div class="item">' +
      '<div class="item-top"><div><div class="item-name">' + esc(it.nama) + '</div>' +
      '<div class="item-sub">' + subL + (katL ? ' · ' + esc(katL) : '') + '</div></div>' +
      '<span class="bchip" style="background:' + color + '">' + esc(bname) + '</span></div>' +
      '<div class="codes">' + codes + '</div>' +
      '<div class="item-btns">' +
        '<button class="btn btn-light" data-edit="' + o.i + '">✏️ Edit</button>' +
        '<button class="btn btn-light" style="color:var(--red);" data-del="' + o.i + '">🗑️ Hapus</button>' +
      '</div></div>';
  }).join('');
}

 $('search').addEventListener('input', renderList);
 $('list').addEventListener('click', function(e){
  var ed = e.target.closest('[data-edit]');
  if (ed) { openForm(parseInt(ed.dataset.edit,10)); return; }
  var dl = e.target.closest('[data-del]');
  if (dl) {
    var i = parseInt(dl.dataset.del,10);
    var it = items[i];
    if (confirm('Hapus "' + it.nama + '"?\n(' + (CONFIG.brandNames[it.brand]||it.brand) + ' · RAW ' + (it.raw||'-') + ')')) {
      items.splice(i,1);
      renderAll();
    }
  }
});

/* ---------- FORM TAMBAH/EDIT ---------- */
function fillSub(brand, current) {
  var sel = $('fSub'); sel.innerHTML = '';
  (CONFIG.subs[brand] || []).forEach(function(s){
    var op = document.createElement('option');
    op.value = s; op.textContent = CONFIG.subLabels[s] || s;
    if (s === current) op.selected = true;
    sel.appendChild(op);
  });
}
function fillKat(brand, sub, current) {
  var sel = $('fKat'); sel.innerHTML = '';
  var map = CONFIG.kategoriMaps[brand + '|' + sub];
  var opts = [];
  if (!map) {
    opts.push({v:'', l:'(kosong)'});
    if (current) opts.push({v:current, l:current + ' (nilai lama)'});
  } else {
    Object.keys(map).forEach(function(k){ opts.push({v:k, l:map[k]}); });
    if (current && !map[current]) opts.push({v:current, l:current + ' (nilai lama)'});
  }
  opts.forEach(function(o){
    var op = document.createElement('option');
    op.value = o.v; op.textContent = o.l;
    if (o.v === (current || '')) op.selected = true;
    sel.appendChild(op);
  });
}

function openForm(idx) {
  editing = (idx === undefined || idx === null) ? null : idx;
  var it = editing !== null ? items[editing] : {brand:curBrand!=='all'?curBrand:CONFIG.brands[0], sub:'', kategori:'', nama:'', raw:'', konv:''};

  $('formTitle').innerText = editing !== null ? '✏️ Edit Item' : '＋ Tambah Item';
  var fb = $('fBrand'); fb.innerHTML = '';
  CONFIG.brands.forEach(function(b){
    var op = document.createElement('option');
    op.value = b; op.textContent = CONFIG.brandNames[b];
    if (b === it.brand) op.selected = true;
    fb.appendChild(op);
  });
  fillSub(fb.value, it.sub);
  fillKat(fb.value, $('fSub').value, it.kategori);
  $('fNama').value = it.nama;
  $('fRaw').value = it.raw;
  $('fKonv').value = it.konv;
  $('formWarn').style.display = 'none';

  $('formBackdrop').classList.add('open');
  if (editing === null) setTimeout(function(){ $('fNama').focus(); }, 350);
}
function closeForm(){ $('formBackdrop').classList.remove('open'); editing = null; }

 $('fBrand').addEventListener('change', function(){ fillSub(this.value, ''); fillKat(this.value, $('fSub').value, ''); });
 $('fSub').addEventListener('change', function(){ fillKat($('fBrand').value, this.value, $('fKat').value); });
 $('btnAdd').addEventListener('click', function(){ openForm(null); });
 $('formClose').addEventListener('click', closeForm);
 $('formBackdrop').addEventListener('click', function(e){ if (e.target === this) closeForm(); });

 $('formSave').addEventListener('click', function(){
  var brand = $('fBrand').value, sub = $('fSub').value, kat = $('fKat').value;
  var nama = $('fNama').value.trim(), raw = $('fRaw').value.trim(), konv = $('fKonv').value.trim();

  if (!nama) { alert('Nama barang wajib diisi.'); return; }
  if (!raw && !konv) { alert('Isi minimal salah satu: PLU RAW atau PLU KONV.'); return; }

  /* deteksi duplikat (kecuali item yang sedang diedit sendiri) */
  var dups = [];
  items.forEach(function(it, i){
    if (editing !== null && i === editing) return;
    if (raw && it.raw === raw) dups.push('PLU RAW ' + raw + ' sudah dipakai oleh: ' + it.nama);
    if (konv && it.konv === konv) dups.push('PLU KONV ' + konv + ' sudah dipakai oleh: ' + it.nama);
    if (it.brand === brand && it.nama.toLowerCase() === nama.toLowerCase()) dups.push('Nama sama sudah ada: ' + it.nama);
  });
  if (dups.length && !confirm('⚠️ Ditemukan:\n• ' + dups.join('\n• ') + '\n\nSimpan tetap?')) return;

  var obj = { brand:brand, sub:sub, kategori:kat, nama:nama, raw:raw, konv:konv };
  if (editing === null) items.push(obj);
  else items[editing] = obj;

  closeForm();
  renderAll();
});

/* ---------- DUPLIKAT SCAN ---------- */
function scanDup() {
  var out = [], byName = {}, byCode = {};
  items.forEach(function(it){
    var k = it.brand + '|' + it.nama.toLowerCase();
    (byName[k] = byName[k] || []).push(it);
    ['raw','konv'].forEach(function(f){
      var c = it[f]; if (c) (byCode[c] = byCode[c] || []).push(it.brand + ' · ' + it.nama);
    });
  });
  Object.keys(byName).forEach(function(k){
    if (byName[k].length > 1) out.push('👥 Duplikat nama: ' + byName[k][0].brand + ' · "' + byName[k][0].nama + '" ×' + byName[k].length);
  });
  Object.keys(byCode).forEach(function(c){
    var u = byCode[c].filter(function(v,i,a){ return a.indexOf(v) === i; });
    if (u.length > 1) out.push('🔢 PLU ' + c + ' dipakai oleh: ' + u.join(' & '));
  });
  items.forEach(function(it){
    if (it.raw && it.konv && it.raw === it.konv) out.push('🟡 RAW = KONV: ' + it.brand + ' · ' + it.nama + ' (' + it.raw + ')');
  });
  return out;
}
function renderDup() {
  var d = scanDup();
  $('dupCount').innerText = d.length;
  $('dupList').innerHTML = d.length
    ? d.map(function(t){ return '<li>' + t + '</li>'; }).join('')
    : '<li>Tidak ada duplikat terdeteksi 👍</li>';
}
 $('dupToggle').addEventListener('click', function(){
  var l = $('dupList');
  var open = l.style.display !== 'none';
  l.style.display = open ? 'none' : '';
  this.innerText = open ? 'tampilkan' : 'sembunyikan';
});

/* ---------- EXPORT ---------- */
 $('btnExport').addEventListener('click', function(){
  var out = '[\n' + items.map(function(it){
    return '  ' + JSON.stringify({ brand:it.brand, sub:it.sub, kategori:it.kategori, nama:it.nama, raw:it.raw, konv:it.konv });
  }).join(',\n') + '\n]';
  var blob = new Blob([out], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'data.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

/* ---------- IMPORT EXCEL ---------- */
 $('fileXlsx').addEventListener('change', function(e){
  var f = e.target.files[0]; if (!f) return;
  var r = new FileReader();
  r.onload = function(ev){
    try {
      var wb = XLSX.read(new Uint8Array(ev.target.result), { type:'array' });
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { defval:'' });
      var parsed = [], skipped = 0;
      rows.forEach(function(row){
        var o = {};
        Object.keys(row).forEach(function(k){ o[String(k).toLowerCase().trim()] = String(row[k]).trim(); });
        if (!o.nama || !o.brand) { skipped++; return; }
        parsed.push({ brand:o.brand, sub:o.sub||'', kategori:o.kategori||'', nama:o.nama, raw:o.raw||'', konv:o.konv||'' });
      });
      if (!parsed.length) {
        alert('Tidak ada baris valid terbaca.\n\nPastikan header kolom di Excel persis: brand, sub, kategori, nama, raw, konv (huruf kecil).');
        return;
      }
      pendingImport = parsed;
      $('impInfo').innerHTML = 'File: <b>' + esc(f.name) + '</b><br>Baris valid: <b>' + parsed.length + '</b><br>Dilewati (brand/nama kosong): ' + skipped + '<br><br>Data saat ini: <b>' + items.length + '</b> item.<br>Pilih cara memasukkan:';
      $('impBackdrop').classList.add('open');
    } catch(err) { alert('Gagal membaca file: ' + err.message); }
  };
  r.readAsArrayBuffer(f);
  e.target.value = '';
});
 $('impClose').addEventListener('click', function(){ $('impBackdrop').classList.remove('open'); });
 $('impReplace').addEventListener('click', function(){
  if (!confirm('GANTI seluruh ' + items.length + ' item saat ini dengan ' + pendingImport.length + ' item dari Excel?')) return;
  items = pendingImport.slice();
  $('impBackdrop').classList.remove('open');
  renderAll();
});
 $('impAppend').addEventListener('click', function(){
  items = items.concat(pendingImport);
  $('impBackdrop').classList.remove('open');
  renderAll();
});

function esc(s){
  return String(s||'').replace(/[&<>"']/g, function(m){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m];
  });
}
