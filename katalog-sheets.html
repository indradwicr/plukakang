<!DOCTYPE html>
<html lang="id">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#000000" />
		<title>plukakang — katalog</title>
		<style>
			*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
			html{color-scheme:dark;-webkit-text-size-adjust:100%}
			button{font-family:inherit;border:0;background:none;cursor:pointer;color:inherit;touch-action:manipulation}
			input{font-family:inherit;outline:none;touch-action:manipulation}
			:root{
			  --line:rgba(255,255,255,.055);--line2:rgba(255,255,255,.14);
			  --t2:rgba(235,235,245,.6);--t3:rgba(235,235,245,.32);
			  --card:#0b0b0e;--field:#151519;
			  --gold:#f7c34c;--red:#ff5757;--grn:#30d158;
			  --top:96px;            /* tinggi topbar — diukur runtime lewat JS */
			  --acc:#f7c34c;         /* aksen brand aktif */
			  --acc-br:#f7c34c;      /* versi terang aksen (untuk teks di bg gelap) */
			  --acc-rgb:247,195,76;  /* rgb mentah aksen (untuk rgba() tint) */
			}
			body{font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;background:#000;color:#fff;font-variant-numeric:tabular-nums;min-height:100dvh;-webkit-font-smoothing:antialiased}
			/* body TANPA height:100% — height membatasi jarak tempuh position:sticky */

			/* ---------- topbar (search + chip brand) ---------- */
			.topbar{position:sticky;top:0;z-index:50;background:rgba(0,0,0,.82);-webkit-backdrop-filter:saturate(1.4) blur(16px);backdrop-filter:saturate(1.4) blur(16px);border-bottom:1px solid var(--line);padding:calc(9px + env(safe-area-inset-top,0px)) 12px 8px}
			.tbin{max-width:520px;margin:0 auto}
			.searchrow{display:flex;gap:8px;align-items:center}
			.searchbox{flex:1;display:flex;align-items:center;gap:8px;background:var(--field);border:1px solid transparent;border-radius:13px;padding:9px 12px;transition:border-color .15s}
			.searchbox:focus-within{border-color:rgba(255,255,255,.22)}
			.searchbox svg{flex:none;width:15px;height:15px;stroke:var(--t3);fill:none;stroke-width:2;stroke-linecap:round}
			.searchbox input{flex:1;border:0;background:none;font-size:14px;font-weight:500;color:#fff;min-width:0}
			.searchbox input::placeholder{color:var(--t3)}
			.qclear{flex:none;width:18px;height:18px;border-radius:50%;background:#2a2a30;color:var(--t2);font-size:12px;line-height:1;display:none;place-items:center;font-weight:700}
			.qclear.show{display:grid}
			.chip{flex:none;font-size:11px;font-weight:700;color:var(--t2);background:var(--field);border:1px solid var(--line);border-radius:99px;padding:8px 11px;white-space:nowrap}
			.brow{display:flex;gap:6px;overflow-x:auto;padding:9px 0 1px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
			.brow::-webkit-scrollbar{display:none}
			.bchip{flex:none;display:flex;align-items:center;gap:7px;padding:8px 12px;border-radius:99px;background:var(--field);border:1px solid var(--line);font-size:11.5px;font-weight:800;letter-spacing:.02em;color:var(--t2);white-space:nowrap;transition:background .15s,color .15s,border-color .15s}
			.bchip .dot{width:7px;height:7px;border-radius:50%;flex:none}
			.bchip.on{background:#fff;color:#000;border-color:#fff}

			/* ---------- canvas ---------- */
			.canvas{max-width:520px;margin:0 auto;padding:0 14px calc(44px + env(safe-area-inset-bottom,0px))}
			.apphead{padding:16px 2px 2px}
			.apphead-row{display:flex;align-items:center;gap:10px}
			.apphead-row>div{flex:1;min-width:0}
			.apptitle{font-size:15px;font-weight:800;letter-spacing:.4px;color:#fff;display:flex;align-items:center;gap:8px;min-width:0}
			.apptitle .dot{width:9px;height:9px;border-radius:50%;background:var(--acc);flex:none}
			.apptitle b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
			.appsub{font-size:10.5px;font-weight:700;letter-spacing:.5px;color:var(--t3);margin-top:4px;text-transform:uppercase}
			.adminbtn{flex:none;width:36px;height:36px;border-radius:12px;background:var(--field);border:1px solid var(--line);display:grid;place-items:center;color:var(--t2);transition:transform .12s}
			.adminbtn:active{transform:scale(.92)}
			.adminbtn svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round}
			.demonote{margin:10px 0 2px;background:rgba(247,195,76,.07);border:1px solid rgba(247,195,76,.3);color:var(--gold);font-size:11.5px;font-weight:600;line-height:1.5;padding:9px 13px;border-radius:14px;text-align:center}
			.demonote b{font-weight:800}

			/* ---------- band kategori (sticky di bawah topbar) ---------- */
			.band{position:sticky;top:var(--top);z-index:5;display:flex;align-items:center;gap:8px;background:#000;padding:16px 2px 8px}
			.band .dot{width:6px;height:6px;border-radius:50%;background:var(--acc);flex:none}
			.band span.lb{font-size:10.5px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;color:var(--t2)}
			.band .n{margin-left:auto;font-size:10px;font-weight:700;color:var(--t3)}

			/* ---------- kartu item ---------- */
			.gcard{background:var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
			.itrow{padding:11px 13px;position:relative}
			.itrow+.itrow{border-top:1px solid var(--line)}
			.itrow:active{background:rgba(255,255,255,.04)}
			.itname{font-size:14px;font-weight:700;color:#fff;line-height:1.35;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
			.itplus{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
			.plu{display:inline-flex;align-items:center;gap:7px;padding:6px 10px;border-radius:11px;background:var(--field);border:1px solid var(--line);font-size:13px;font-weight:700;color:#fff;letter-spacing:.02em;transition:transform .1s,background .15s,border-color .15s}
			.plu:active{transform:scale(.96)}
			.plu i{font-style:normal;font-size:8.5px;font-weight:800;letter-spacing:.8px;text-transform:uppercase;color:var(--t3)}
			.plu.c-raw{background:rgba(var(--acc-rgb),.13);border-color:rgba(var(--acc-rgb),.32);color:var(--acc-br)}
			.plu.c-raw i{color:var(--acc-br);opacity:.6}
			.plu.sel{transform:scale(.96)}
			.plu.c-raw.sel{background:rgba(var(--acc-rgb),.3);border-color:rgba(var(--acc-rgb),.6)}
			.plu.c-konv.sel{background:#26262c;border-color:rgba(255,255,255,.45)}
			.noplus{font-size:11px;font-weight:600;color:var(--t3)}

			/* ---------- ghost / empty ---------- */
			.ghost{border:1.5px dashed var(--line2);border-radius:16px;text-align:center;color:var(--t2);padding:44px 20px;font-size:13px;font-weight:500;line-height:1.6;margin-top:14px}
			.ghost b{display:block;font-size:14px;color:#fff;margin-bottom:3px;font-weight:800}

			/* ---------- toast (atas, ala versi hitam) ---------- */
			#toast{position:fixed;top:calc(14px + env(safe-area-inset-top,0px));left:50%;transform:translateX(-50%) translateY(-90px);background:#1c1c22;border:1px solid var(--line2);color:#fff;padding:10px 18px;border-radius:99px;font-size:13px;font-weight:700;z-index:80;transition:transform .28s cubic-bezier(.32,.72,.33,1);pointer-events:none;max-width:88%;text-align:center}
			#toast.show{transform:translateX(-50%) translateY(0)}
		</style>
	</head>

					</div>

				</div>
				<div class="brow" id="brow"></div>
			</div>
		</header>

			<div id="list"></div>
		</main>

			    });
			  }
			  if (navigator.clipboard && window.isSecureContext){
			    /* kalau clipboard API ditolak (gesture tidak valid dsb) → fallback execCommand */
			    return navigator.clipboard.writeText(t).catch(function(){ return fallback(); });
			  }
			  return fallback();
			}
			var toastTimer = null;
			function toast(msg){
			  var el = $('toast'); el.textContent = msg; el.classList.add('show');
			  clearTimeout(toastTimer);
			  toastTimer = setTimeout(function(){ el.classList.remove('show'); }, 1900);
			}

			/* ================= data ================= */
			function loadData(){
			  return fetch('data.json?v=' + Date.now())
			    .then(function(r){ if (!r.ok) throw 0; return r.json(); })
			    .then(function(j){
			      var arr = Array.isArray(j) ? j : (j && Array.isArray(j.data) ? j.data : null);
			      if (!arr || !arr.length) throw 0;
			      return arr;
			    })
			    .catch(function(){ IS_DEMO = true; return DEMO_DATA; });
			}
			function indexData(){
			  byBrand = {};
			  DATA.forEach(function(it){
			    var b = brandKey(it.brand);
			    if (CONFIG.brands.indexOf(b) === -1) b = 'perishable';
			    (byBrand[b] = byBrand[b] || []).push(it);
			  });
			}

			/* ================= aksen brand di tema gelap ================= */
			function applyAccent(b){
			  var acc = CONFIG.colors[b] || '#f7c34c';
			  var c = hexRgb(acc);
			  var st = document.documentElement.style;
			  var br = c.map(function(v){ return Math.round(v + (255 - v) * .38); }); /* diterangkan biar cakep di bg hitam */
			  st.setProperty('--acc', acc);
			  st.setProperty('--acc-br', 'rgb(' + br.join(',') + ')');
			  st.setProperty('--acc-rgb', c.join(','));
			}

			/* ================= struktur band kategori ================= */
			function buildBands(b, items){
			  var subs = CONFIG.subs[b] || [];
			  var map = CONFIG.kategoriMaps[b + '|bkl'];
			  var bkl = items.filter(function(i){ return norm(i.sub) === 'bkl'; });
			  var out = [], used = {}, i;

			  function push(label, arr){
			    arr = arr.slice().sort(byNama);
			    if (arr.length) out.push({ label: label, items: arr });
			  }
			  if (map){
			    Object.keys(map).forEach(function(k){
			      var arr = bkl.filter(function(i){ return norm(i.kategori) === k; });
			      arr.forEach(function(i){ used[norm(i.nama)] = 1; });
			      push(map[k], arr);
			    });
			    var misc = bkl.filter(function(i){ return !used[norm(i.nama)]; });
			    push('Bahan Baku', misc);
			  } else {
			    push('Bahan Baku', bkl);
			  }
			  subs.forEach(function(s){
			    if (s === 'bkl') return;
			    push(CONFIG.subLabels[s] || s, items.filter(function(i){ return norm(i.sub) === s; }));
			  });
			  /* sisa item yang sub-nya tidak terdaftar → band Lain-lain */
			  var known = {};
			  CONFIG.subs[b] && CONFIG.subs[b].forEach(function(s){ known[s] = 1; });
			  push('Lain-lain', items.filter(function(i){ return !known[norm(i.sub)]; }));
			  return out;
			}

			/* ================= render ================= */
			function renderChips(){
			  $('brow').innerHTML = CONFIG.brands.map(function(b){
			    return '<button class="bchip' + (b === CUR ? ' on' : '') + '" data-b="' + b + '">' +
			      '<span class="dot" style="background:' + CONFIG.colors[b] + '"></span>' +
			      esc(CONFIG.names[b]) + '</button>';
			  }).join('');
			}
			function rowHtml(it){
			  var chips = '';
			  if (String(it.raw || '').length)  chips += '<button class="plu c-raw" data-v="' + esc(it.raw) + '" data-t="RAW"><i>RAW</i>' + esc(it.raw) + '</button>';
			  if (String(it.konv || '').length) chips += '<button class="plu c-konv" data-v="' + esc(it.konv) + '" data-t="KONVERSI"><i>KONV</i>' + esc(it.konv) + '</button>';
			  if (!chips) chips = '<span class="noplus">PLU belum diisi</span>';
			  return '<div class="itrow" data-raw="' + esc(it.raw) + '" data-konv="' + esc(it.konv) + '">' +
			    '<div class="itname" title="' + esc(it.nama) + '">' + esc(it.nama) + '</div>' +
			    '<div class="itplus">' + chips + '</div></div>';
			}
			function renderList(){
			  var items = byBrand[CUR] || [];
			  var q = norm(Q);
			  var shown = q ? items.filter(function(i){
			    return norm(i.nama).indexOf(q) > -1 || norm(i.raw).indexOf(q) > -1 || norm(i.konv).indexOf(q) > -1;
			  }) : items;

			  $('chip').textContent = q ? (shown.length + '/' + items.length + ' item') : (items.length + ' item');
			  $('appTitle').innerHTML = '<span class="dot"></span><b>' + esc(CONFIG.names[CUR] || CUR) + '</b>';
			  document.title = 'plukakang · ' + (CONFIG.names[CUR] || CUR);

			  var g = $('list');
			  if (!items.length){
			    g.innerHTML = '<div class="ghost"><b>Katalog kosong</b>Belum ada item untuk ' + esc(CONFIG.names[CUR] || CUR) + ' di data.json</div>';
			    return;
			  }
			  if (!shown.length){
			    g.innerHTML = '<div class="ghost"><b>Tidak ada hasil</b>Tidak ada nama atau PLU yang cocok dengan “' + esc(Q) + '”</div>';
			    return;
			  }
			  g.innerHTML = buildBands(CUR, shown).map(function(b){
			    return '<div class="band"><span class="dot"></span><span class="lb">' + esc(b.label) + '</span>' +
			      '<span class="n">' + b.items.length + '</span></div>' +
			      '<div class="gcard">' + b.items.map(rowHtml).join('') + '</div>';
			  }).join('');
			}
			function switchBrand(b){
			  CUR = b;
			  try { localStorage.setItem(LS_KEY, b); } catch(e){}
			  applyAccent(b);
			  renderChips();
			  renderList();
			  window.scrollTo(0, 0);
			}
			function measureTop(){
			  var h = $('topbar').getBoundingClientRect().bottom;
			  document.documentElement.style.setProperty('--top', Math.ceil(h) + 'px');
			}

			/* ================= event ================= */
			$('brow').addEventListener('click', function(e){
			  var t = e.target.closest('.bchip'); if (t) switchBrand(t.getAttribute('data-b'));
			});
			$('list').addEventListener('click', function(e){
			  var plu = e.target.closest('.plu');
			  if (plu){
			    flashCopy(plu, plu.getAttribute('data-v'), plu.getAttribute('data-t'));
			    return;
			  }
			  var row = e.target.closest('.itrow'); if (!row) return;
			  var raw = row.getAttribute('data-raw'), konv = row.getAttribute('data-konv');
			  var val = raw || konv;
			  if (!val){ toast('PLU-nya kosong'); return; }
			  flashCopy(row.querySelector(raw ? '.c-raw' : '.c-konv'), val, raw ? 'RAW' : 'KONVERSI');
			});
			function flashCopy(el, val, type){
			  if (!el || !val) return;
			  var old = document.querySelector('.plu.sel'); if (old) old.classList.remove('sel');
			  el.classList.add('sel');
			  setTimeout(function(){ el.classList.remove('sel'); }, 750);
			  copyText(val).then(function(){ toast('✓ ' + val + ' disalin · ' + type); });
			}
			var qTimer = null;
			$('q').addEventListener('input', function(){
			  var v = this.value;
			  $('qclear').classList.toggle('show', !!v);
			  clearTimeout(qTimer);
			  qTimer = setTimeout(function(){ Q = v; renderList(); }, 140);
			});
			$('qclear').addEventListener('click', function(){
			  $('q').value = ''; Q = ''; $('qclear').classList.remove('show'); renderList();
			});
			$('btnAdmin').addEventListener('click', function(){
			  toast('Membuka admin…');
			  setTimeout(function(){ window.open('admin.html', '_blank'); }, 350);
			});
			window.addEventListener('resize', measureTop);
			window.addEventListener('orientationchange', function(){ setTimeout(measureTop, 120); });

			/* ================= boot ================= */
			loadData().then(function(arr){
			  DATA = arr;
			  indexData();
			  var saved = null;
			  try { saved = localStorage.getItem(LS_KEY); } catch(e){}
			  switchBrand(CONFIG.brands.indexOf(saved) > -1 ? saved : CONFIG.brands[0]);
			  measureTop();
			  if (IS_DEMO) $('demoNote').hidden = false;
			});
		</script>
	</body>
